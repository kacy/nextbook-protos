name: Buf CI

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: buf lint

      - name: Breaking changes
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'

      - name: Format check
        run: buf format --diff --exit-code

      - name: Generate and verify no diff
        run: |
          buf generate
          cd gen/go && go mod tidy && cd ../..
          git diff --exit-code gen/ || (echo "Generated code is out of date. Run 'make generate' and commit." && exit 1)
